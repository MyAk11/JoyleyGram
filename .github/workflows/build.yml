name: Build JoyleyGram APK

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build JoyleyGram APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout JoyleyGram repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | $SDKMANAGER --sdk_root="$ANDROID_HOME" --licenses || true
          $SDKMANAGER --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JoyleyGram APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace --no-daemon

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p build_output
          find . -name "*.apk" -exec cp {} build_output/ \;
          ls -la build_output/

      - name: Upload JoyleyGram APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JoyleyGram-APK
          path: build_output/*.apk
          if-no-files-found: warn
