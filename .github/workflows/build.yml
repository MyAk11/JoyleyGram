name: Build JoyleyGram APK

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build JoyleyGram APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout JoyleyGram repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JoyleyGram APK
        run: ./gradlew assembleAfatDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p build_output
          find . -name "*.apk" -exec cp {} build_output/ \;
          ls -la build_output/

      - name: Upload JoyleyGram APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyleyGram-APK
          path: build_output/*.apk
